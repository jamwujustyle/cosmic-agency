{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Космическое агентство - NASA</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Slick Slider CSS -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"
    />

    <!-- Fancybox CSS (for fullscreen gallery) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <!-- Header / Navbar -->
    <nav
      class="navbar navbar-dark navbar-expand-lg bg-black py-3 border-bottom border-dark border-opacity-50"
    >
      <div class="container">
        <!-- Logo (Left on desktop, Center on mobile) -->
        <a class="navbar-brand m-0 p-0 order-lg-0" href="#">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/e/e5/NASA_logo.svg"
            alt="NASA Logo"
            height="35"
          />
        </a>

        <!-- Desktop Nav Links (visible only on lg+) -->
        <div class="d-none d-lg-flex gap-4 order-lg-1 mx-auto">
          <a
            class="nav-link text-white text-uppercase fw-semibold"
            href="#features"
            style="font-size: 0.8rem; letter-spacing: 0.05em"
            >Преимущества</a
          >
          <a
            class="nav-link text-white text-uppercase fw-semibold"
            href="#gallery"
            style="font-size: 0.8rem; letter-spacing: 0.05em"
            >Фотографии</a
          >
        </div>

        <!-- Login Button (Right) -->
        <a
          href="/admin/"
          class="btn btn-danger fw-bold rounded-1 px-3 py-1 text-uppercase order-lg-2"
          style="font-size: 0.8rem"
          >Вход</a
        >
      </div>
    </nav>

    <!-- Main Content Block -->
    <main>{% block content %}{% endblock %}</main>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery (required for Slick) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Slick Slider JS -->
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"
    ></script>

    <!-- Fancybox JS -->
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>

    <!-- Custom JS -->
    <script src="{% static 'js/main.js' %}"></script>
  </body>
</html>

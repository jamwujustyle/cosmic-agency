version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: nasa_slider_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: slider_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrator:
    build: .
    container_name: nasa_slider_migrator
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: slider_db
    command: ["./migrator.sh"]

  web:
    build: .
    container_name: nasa_slider_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: slider_db
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  mysql_data:
